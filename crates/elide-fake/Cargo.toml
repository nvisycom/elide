# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-fake"
description = "Locale-aware fake-data anonymizer operator for the Elide toolkit"
keywords = ["elide", "fake", "anonymizer", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = ["tabular"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
fake = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

# On wasm the RNG that `fake`/`rand` and uuid v4 pull needs its browser entropy
# backend enabled. `fake` seeds deterministically at runtime, but its `rand`
# dependency still compiles `getrandom`, which must be told to use the JS
# backend (paired with the `getrandom_backend` cfg in `.cargo/config.toml`).
# Native builds are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["v4", "js"] }

[dev-dependencies]
# Internal crates
elide = { path = "../elide", default-features = false, features = ["tabular"] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
