# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-lingua"
description = "Lingua-backed language detection for the Elide toolkit"
keywords = ["language-detection", "nlp", "lingua", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No language models by default: `lingua` compiles one model per language,
## and the full set is large, so a caller opts into the coverage it needs.
## Detection over a set with no models loaded resolves to nothing — pick
## `common` for the usual set or `all` for every language `lingua` ships.
default = []

## The most widely-used languages — a practical default for documents whose
## language is one of the major world/business languages. Keeps the model
## footprint modest compared to `all`.
common = [
    "lingua/english",
    "lingua/spanish",
    "lingua/portuguese",
    "lingua/french",
    "lingua/german",
    "lingua/italian",
    "lingua/dutch",
    "lingua/russian",
    "lingua/polish",
    "lingua/turkish",
    "lingua/arabic",
    "lingua/chinese",
    "lingua/japanese",
    "lingua/korean",
    "lingua/hindi",
]

## Every language model `lingua` ships (~75). Largest footprint; use when a
## document may be in any language.
all = ["lingua/default"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = ["serde"] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# Natural language processing
lingua = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
elide-core = { workspace = true, features = ["serde", "tabular"] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
