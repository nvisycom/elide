# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-office"
description = "Office Open XML (DOCX today; XLSX/PPTX planned) text extraction and byte-faithful redaction: bytes in, bytes out"
keywords = ["ooxml", "docx", "office", "redaction", "extraction"]
categories = ["parsing", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No default features: the crate is a self-contained bytes-in/bytes-out
## library with no elide dependencies.
default = []

## Derive `serde::{Serialize, Deserialize}` on the extraction/coverage model,
## so a caller can ship an extraction result across a boundary.
serde = ["dep:serde"]

## Expose `opc::test_util`, readers that decompress a package's parts so a
## dependent crate's tests can assert on individual parts. Test scaffolding,
## not part of the shipped surface.
test-util = []

## Adapt the OOXML formats (DOCX, PPTX, XLSX) to the `elide-codec`
## `Handler`/`Loader` contracts: the per-format seams over the shared OOXML
## codec adapter, plus the `Metadata`-modality `#docprops` sub-part handler +
## recognizer shared by all three. Pulls `elide-codec`'s `internal_extract`
## helper (DOCX/PPTX splice text through the shared extract-and-splice engine)
## and `internal_text` (XLSX cells redact through the shared byte-range
## helper), and elide-core's `metadata` modality for the docProps path.
codec = [
    "dep:elide-codec",
    "dep:async-trait",
    "elide-codec/internal_extract",
    "elide-codec/internal_text",
    "elide-core/metadata",
    "elide-core/tabular",
]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [], optional = true }
elide-codec = { workspace = true, features = [], optional = true }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }

# Derive macros & error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [], optional = true }

# Markup parsing
quick-xml = { workspace = true, features = [] }

# Compression
zip = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
elide-codec = { workspace = true, features = [] }
elide-core = { workspace = true, features = [] }

# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
