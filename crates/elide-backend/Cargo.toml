# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-backend"
description = "Backend decorators for Elide: usage metering, observability sinks, and concurrency rate-limiting over the model-call contract"
keywords = ["elide", "backend", "metrics", "rate-limit", "usage"]
categories = ["development-tools::profiling"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## The `metrics` module (`Metered`, the `Usage` record, the `UsageCollector`) is
## always available — it pulls no extra dependency. Off by default are the things
## that do: `ratelimit` (the `RateLimited` decorator, which needs an async
## runtime) and the observability sinks (`tracing`, `recorder`).
default = []

## The `RateLimited` decorator: cap a backend's concurrent calls with a
## semaphore. Pulls the Tokio sync primitives.
ratelimit = ["dep:tokio"]

## Derive `serde::{Serialize, Deserialize}` on the usage record (`Usage`,
## `ModelUsage`, `Outcome`), so a run's usage can be shipped across a boundary.
serde = ["dep:serde", "elide-core/serde"]
## Derive `schemars::JsonSchema` on the usage record. Implies `serde`.
schema = ["serde", "dep:schemars", "elide-core/schema"]

## The `TracingSink`: emit each backend call's usage as a `tracing` event, so it
## lands in whatever subscriber the process runs alongside the backends' own
## spans.
tracing = ["dep:tracing"]

## The `MetricsSink`: record each backend call's usage through the `metrics`
## facade (call/duration/output/token metrics), to whatever recorder
## (Prometheus, StatsD, …) the process installs.
recorder = ["dep:metrics"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["sync"], optional = true }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, features = [], optional = true }

# Observability
tracing = { workspace = true, features = [], optional = true }
metrics = { workspace = true, features = [], optional = true }

[dev-dependencies]
# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt", "time"] }
