# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-engine"
description = "Document orchestration for the Elide toolkit: drive analysis + redaction across a multi-modal container"
keywords = ["pii", "orchestration", "redaction", "document"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Derive `schemars::JsonSchema` on the re-exported core types. `Report`
## itself serializes through `erased-serde` (a type-erased entity view) and
## has no derivable schema; this forwards schema support to the engine crates
## so a consumer can describe the entities a report carries. serde is always
## on for this crate (the `Report` exists to serialize), so schema only adds
## the schemars derives on top.
schema = [
    "elide-core/schema",
    "elide-detection/schema",
    "elide-redaction/schema",
    "elide-codec/schema",
]

## Resource-usage accounting: carry the per-recognizer / per-enricher usage a
## document's analysis incurred on the [`Report`]. Off by default.
usage = ["elide-core/usage", "elide-detection/usage"]

[dependencies]
# Internal crates. serde support is required — a `Report` exists to be
# serialized for external review and reconstructed with `deserialize_report`.
elide-core = { workspace = true, features = ["serde"] }
elide-detection = { workspace = true, features = ["serde"] }
elide-redaction = { workspace = true, features = ["serde"] }
elide-codec = { workspace = true, features = ["serde"] }

# (De)serialization — required, not optional.
serde = { workspace = true, features = [] }
erased-serde = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }
