# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-engine"
description = "Document orchestration for the Elide toolkit: drive analysis + redaction across a multi-modal container"
keywords = ["pii", "orchestration", "redaction", "document"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Derive `schemars::JsonSchema` across the engine crates and hand-author it for
## [`Report`], whose wire form is a hand-written `Serialize` (a type-erased
## entity view). The report schema's per-modality group arms are gated on the
## modality features below, so it describes exactly the modalities compiled in.
## serde is always on for this crate, so schema only adds the schemars derives.
schema = [
    "dep:schemars",
    "dep:serde_json",
    "elide-core/schema",
    "elide-detection/schema",
    "elide-redaction/schema",
    "elide-codec/schema",
    "elide-format/schema",
    "elide-image?/schema",
    "elide-audio?/schema",
]

## The non-text modalities, forwarded to `elide-core`. A report can carry a
## group of any compiled-in modality, so these gate the matching arm of the
## `Report` JSON schema; `text` is always available.
image = ["dep:elide-image"]
audio = ["dep:elide-audio"]
tabular = ["elide-core/tabular"]
metadata = ["elide-core/metadata"]

## Resource-usage accounting: carry the per-recognizer / per-enricher usage a
## document's analysis incurred on the [`Report`]. Off by default.
usage = ["elide-core/usage", "elide-detection/usage"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = ["serde"] }
elide-detection = { workspace = true, features = ["serde"] }
elide-redaction = { workspace = true, features = ["serde"] }
elide-codec = { workspace = true, features = ["serde"] }
elide-format = { workspace = true, features = ["serde"] }
elide-image = { workspace = true, features = ["serde"], optional = true }
elide-audio = { workspace = true, features = ["serde"], optional = true }

# (De)serialization
serde = { workspace = true, features = [] }
erased-serde = { workspace = true, features = [] }
serde-value = { workspace = true, features = [] }
serde_json = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }
smallvec = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }

# Templating & schema
schemars = { workspace = true, features = [], optional = true }

[dev-dependencies]
# Internal crates
elide-codec = { workspace = true, features = ["serde"] }
elide-format = { workspace = true, features = ["serde", "png", "jpeg"] }
elide-image = { workspace = true, features = ["exif", "jpeg", "png"] }
elide-operator = { workspace = true, features = ["image", "metadata"] }

# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
async-trait = { workspace = true, features = [] }

# Image processing
image = { workspace = true, features = [] }
little_exif = { workspace = true, features = [] }

# Templating & schema
jsonschema = { workspace = true, features = [] }
