# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-codec"
description = "Codec traits and format handlers for reading and redacting documents"
keywords = ["elide", "codec", "document", "redaction"]
categories = ["encoding", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No format by default: `elide-codec` ships the codec contracts and the
## shared text-extract / redact helpers. Every format handler lives with its
## own engine crate (`elide-audio`, `elide-image`, `elide-office`, `elide-pdf`)
## behind that crate's own `codec` feature; the `FormatRegistry` assembling
## them lives in `elide-format`.
default = []

## Forward `serde::{Serialize, Deserialize}` derives to `elide-core`, for
## consumers who serialize the entities a codec reads.
serde = ["elide-core/serde"]

## Forward `schemars::JsonSchema` derives to `elide-core`.
schema = ["elide-core/schema"]

## Compile the `extract` module: the shared text-extract-and-splice engine
## (`Encoder`, `ExtractHandler`) that maps a decoded value back to raw source
## offsets. Enabled by a crate that drives a structured text format on it
## (`elide-plain`'s markup handlers, `elide-office`'s OOXML). The `string` and
## `content` helpers it builds on are always compiled.
extract = []

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }

# Encoding & hashing
sha2 = { workspace = true, features = [] }
hex = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
