# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-codec"
description = "Codec traits and format handlers for reading and redacting documents"
keywords = ["elide", "codec", "document", "redaction"]
categories = ["encoding", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No format by default: `elide-codec` ships the codec contracts and the
## shared text-extract / redact helpers. Every format handler lives with its
## own engine crate (`elide-audio`, `elide-image`, `elide-office`, `elide-pdf`)
## behind that crate's own `codec` feature; the `FormatRegistry` assembling
## them lives in `elide-format`.
default = []

## Derive `serde::{Serialize, Deserialize}` on the re-exported core
## domain types. Also forwards to `elide-core` for consumers who serialize the
## entities a codec reads.
serde = ["dep:serde", "elide-core/serde"]

## Derive `schemars::JsonSchema` on the re-exported domain types. Forwards to
## `elide-core`.
schema = ["dep:schemars", "elide-core/schema"]

# The shared text-extract-and-splice engine (`extract`) and the byte-level
# string-redaction helper (`redact`): public helper surface, not gated behind
# a format feature here since no format in this crate uses them (`elide-office`
# and `elide-image` drive their own OOXML/text-shaped handlers on top of them).
internal_text = []
internal_extract = ["internal_text"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }

# Encoding & hashing
sha2 = { workspace = true, features = [] }
hex = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
