# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide"
description = "Composable, multimodal toolkit for detecting and redacting sensitive data: recognizers, dedup layers, redaction operators, and codecs"
keywords = ["elide", "pii", "detection", "redaction"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## The recognizer crates most pipelines use: pattern, NER, and LLM. Set
## `default-features = false` to drop them and opt into only what you need
## (e.g. `codec`, `serde`).
default = ["pattern", "ner", "llm"]

## Derive `serde::{Serialize, Deserialize}` on the re-exported domain types.
## Recognizer crates (`pattern`/`ner`/`llm`) need serde structurally and pull
## it in regardless; each optional modality/codec crate (`audio`/`image`/`pdf`/
## `office`/`codec`/`format`) is forwarded only when it is enabled.
## (`elide-engine` requires serde unconditionally, so the `engine` feature
## pulls it in on its own — no forward needed here.)
serde = [
    "elide-core/serde",
    "elide-detection/serde",
    "elide-operator/serde",
    "elide-redaction/serde",
    "elide-audio?/serde",
    "elide-image?/serde",
    "elide-pdf?/serde",
    "elide-office?/serde",
    "elide-codec?/serde",
    "elide-format?/serde",
]

## Derive `schemars::JsonSchema` on the re-exported domain types, for
## emitting JSON Schemas of the serialized model. Implies serde. Forwards to
## the always-present engine crates; each optional crate (`audio`/`image`/`pdf`/
## `codec`/`format`/`engine`/`ner`) is forwarded only when it is enabled.
## (`elide-office` has no schema-relevant config types, so no forward there.)
schema = [
    "serde",
    "elide-core/schema",
    "elide-detection/schema",
    "elide-operator/schema",
    "elide-redaction/schema",
    "elide-audio?/schema",
    "elide-image?/schema",
    "elide-pdf?/schema",
    "elide-codec?/schema",
    "elide-format?/schema",
    "elide-engine?/schema",
    "elide-ner?/schema",
]

## Re-export the pattern recognizer crate.
pattern = ["dep:elide-pattern"]
## Re-export the NER recognizer crate.
ner = ["dep:elide-ner"]

## Re-export the lingua language-detection crate. On its own no language
## models are compiled in — add `lingua-common` or `lingua-all` for coverage.
lingua = ["dep:elide-lingua"]
## Lingua with the most widely-used language models.
lingua-common = ["lingua", "elide-lingua/common"]
## Lingua with every language model it ships (~75).
lingua-all = ["lingua", "elide-lingua/all"]

## Re-export the LLM recognizer crate. Lean by default (the trait, recognizer,
## prompts, and — with `mocks` — the stub backend); add `llm-rig` or a provider
## feature for the rig-backed network backend.
llm = ["dep:elide-llm"]
## The rig-backed `RigBackend` and its HTTP stack in the re-exported LLM
## crate.
llm-rig = ["llm", "elide-llm/rig"]
## The `Jinja2Prompt` template-driven prompt builder, so a caller can load
## detect-pass prompts from `.j2` templates without depending on `elide-llm`
## directly.
llm-jinja2 = ["llm", "elide-llm/jinja2"]

## Re-export the STT (speech-to-text) recognizer (from the audio crate).
stt = ["dep:elide-audio", "elide-audio/stt", "audio"]
## Re-export the OCR recognizer (from the image crate).
ocr = ["dep:elide-image", "elide-image/ocr", "image"]

## The `audio` modality. Implied by the audio codec formats.
audio = ["dep:elide-audio", "elide-operator/audio", "elide-engine?/audio"]
## The `image` modality. Implied by the image codec formats. Enables the light
## `exif` path (little_exif, no pixel codec) so `ExifPolicy` is nameable without
## a decoder, and pulls in the `metadata` modality: a raster image carries EXIF
## metadata as a redactable sub-part.
image = ["dep:elide-image", "elide-image/exif", "elide-operator/image", "elide-engine?/image", "metadata"]
## The `metadata` modality: a document's out-of-band fields (EXIF, document
## properties) as redaction subjects.
metadata = ["elide-core/metadata", "elide-operator/metadata", "elide-engine?/metadata"]
## The `tabular` modality. Implied by the tabular codec formats.
tabular = ["elide-core/tabular", "elide-operator/tabular", "elide-redaction/tabular", "elide-engine?/tabular"]

## Re-export the codec crate: the `codec` module (`FormatRegistry`, decode /
## encode). On its own this enables no formats; use the per-modality or
## per-format `codec-*` features below to pull in the shipped handlers. For the
## `Orchestrator` / `Report` that drive analyze + redact across a decoded
## document, enable `engine`.
codec = ["dep:elide-codec", "dep:elide-format"]

## Re-export the orchestration engine: the `engine` module (`Orchestrator`,
## `Report`, `Directives`). Implies `codec` (the orchestrator decodes documents
## through it) and `serde` (`elide-engine` requires it — a `Report` exists to be
## serialized for review and reconstructed with `deserialize_report`).
engine = ["dep:elide-engine", "codec", "serde"]

## Magic-byte sniffing: infer a binary format from the leading bytes when a
## document carries no filename extension or content type (see
## `FormatRegistry::decode_content`).
codec-sniff = ["codec", "elide-format/sniff"]

## Per-modality format groups (each aggregates formats that share a decoder
## substrate). The image and audio groups also unlock their enricher recognizer
## (`ocr`/`stt`): if you can decode the pixels or samples you almost certainly
## want the enricher seam, and it is inert trait weight until a backend is added.
## There is deliberately no `codec-document` umbrella: DOCX/PPTX (OOXML, via
## `codec-ooxml`) and PDF share no engine, so an aggregate would only over-pull.
codec-text = ["codec-txt", "codec-json", "codec-html", "codec-xml"]
codec-tabular = ["codec-csv", "codec-xlsx"]
codec-image = ["codec-png", "codec-jpeg", "codec-tiff", "ocr"]
codec-audio = ["codec-wav", "codec-mp3", "stt"]
codec-ooxml = ["codec-docx", "codec-pptx"]

## Per-format handlers.
codec-txt = ["codec", "dep:elide-plain", "elide-plain/txt", "elide-format/txt"]
codec-json = ["codec", "dep:elide-plain", "elide-plain/json", "elide-format/json"]
codec-html = ["codec", "dep:elide-plain", "elide-plain/html", "elide-format/html"]
codec-xml = ["codec", "dep:elide-plain", "elide-plain/xml", "elide-format/xml"]
codec-csv = ["codec", "tabular", "dep:elide-plain", "elide-plain/csv", "elide-format/csv"]
codec-xlsx = ["codec", "tabular", "dep:elide-office", "elide-format/xlsx", "metadata"]
codec-png = ["codec", "image", "elide-image/codec", "elide-image/png", "elide-format/png"]
codec-jpeg = ["codec", "image", "elide-image/codec", "elide-image/jpeg", "elide-format/jpeg"]
codec-tiff = ["codec", "image", "elide-image/codec", "elide-image/tiff", "elide-format/tiff"]
codec-wav = ["codec", "audio", "elide-format/wav"]
codec-mp3 = ["codec", "audio", "elide-format/mp3"]
codec-docx = ["codec", "dep:elide-office", "elide-format/docx", "metadata"]
codec-pptx = ["codec", "dep:elide-office", "elide-format/pptx", "metadata"]
codec-pdf = ["codec", "dep:elide-pdf", "elide-format/pdf"]
codec-pdf-render = ["codec-pdf", "elide-format/pdf-render"]

## Ship the no-op mock backends in the re-exported recognizer crates.
mocks = ["elide-ner?/mocks", "elide-llm?/mocks", "elide-audio?/mocks", "elide-image?/mocks"]

## Backend usage accounting: the `Metered` wrapper, the `Usage` record, and the
## `UsageCollector`, re-exported from `elide-metrics`. Off by default — a pipeline
## that does not meter its backends compiles none of it.
usage = ["dep:elide-metrics"]
## The `metrics`-facade usage sink (`MetricsSink`): route backend usage to a
## Prometheus/StatsD recorder. Implies `usage`.
metrics = ["usage", "elide-metrics/metrics"]
## The `tracing` usage sink (`TracingSink`): emit backend usage as tracing events.
## Implies `usage`.
metrics-tracing = ["usage", "elide-metrics/tracing"]

## The one-way `Sha2Hash` operator (SHA-256 / SHA-512).
operator-sha2 = ["elide-operator/sha2"]
## The keyed `HmacHash` operator (HMAC-SHA-256 / HMAC-SHA-512).
operator-hmac = ["elide-operator/hmac"]
## The reversible `AesEncrypt` operator (AES-256-GCM) and its `KeyProvider`.
operator-aes = ["elide-operator/aes"]
## The `GeneralizeDate` operator (reduce date/timestamp granularity).
operator-datetime = ["elide-operator/datetime"]
## The locale-aware `Fake` redaction operator based on the `fake` crate.
operator-fake = ["elide-operator/fake"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }
elide-context = { workspace = true, features = [] }
elide-detection = { workspace = true, features = [] }
elide-pattern = { workspace = true, features = [], optional = true }
elide-ner = { workspace = true, features = [], optional = true }
elide-lingua = { workspace = true, features = [], optional = true }
elide-llm = { workspace = true, features = [], optional = true }
elide-audio = { workspace = true, features = [], optional = true }
elide-image = { workspace = true, features = [], optional = true }
elide-plain = { workspace = true, features = [], optional = true }
elide-office = { workspace = true, features = [], optional = true }
elide-pdf = { workspace = true, features = [], optional = true }
elide-codec = { workspace = true, features = [], optional = true }
elide-format = { workspace = true, features = [], optional = true }
elide-engine = { workspace = true, features = [], optional = true }
elide-metrics = { workspace = true, features = [], optional = true }
elide-operator = { workspace = true, features = [] }
elide-redaction = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
elide-core = { workspace = true, features = ["fixtures", "mocks"] }
elide-office = { workspace = true, features = ["fixtures"] }
elide-image = { workspace = true, features = ["fixtures"] }
elide-audio = { workspace = true, features = ["fixtures", "wav"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = ["v4"] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Testing and benchmarking
criterion = { workspace = true }

[[bench]]
name = "pipeline"
harness = false
required-features = ["engine", "codec-txt", "codec-docx"]

# Format families: one test binary per format (or format family), each a
# folder of scenario files under a same-named driver. The OOXML formats
# (docx, xlsx, …) share the OPC package engine, so they share one `office`
# binary; PDF's born-digital and raster paths share `format_pdf`.
[[test]]
name = "format_ooxml"
required-features = ["codec-docx", "codec-xlsx", "codec-pptx", "codec-xml", "mocks", "engine", "serde"]

[[test]]
name = "format_pdf"
required-features = ["codec-pdf-render", "mocks", "engine", "serde"]

[[test]]
name = "format_txt"
required-features = ["codec-txt", "ner", "llm", "lingua-common", "mocks", "engine", "serde"]

[[test]]
name = "format_json"
required-features = ["codec-json", "mocks", "engine", "serde"]

[[test]]
name = "format_html"
required-features = ["codec-html", "mocks", "engine", "serde"]

[[test]]
name = "format_xml"
required-features = ["codec-xml", "mocks", "engine", "serde"]

[[test]]
name = "format_csv"
required-features = ["codec-csv", "ner", "llm", "lingua-common", "mocks", "engine", "serde"]

[[test]]
name = "format_image"
required-features = ["codec-png", "codec-jpeg", "codec-tiff", "ocr", "mocks", "engine", "serde"]

[[test]]
name = "format_audio"
required-features = ["codec-wav", "codec-mp3", "stt", "mocks", "engine", "serde"]

# Format-independent facade integration: detection pipeline, audit trail,
# cross-modal context enhancement, and the reviewable `select` seam.
[[test]]
name = "pipeline"
required-features = ["codec-docx", "codec-png", "llm", "ocr", "stt", "mocks", "engine", "serde"]
