# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide"
description = "Composable component library for Elide pipelines: recognizers, dedup layers, checks, redaction strategies"
keywords = ["elide", "toolkit", "components", "pipeline"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## The recognizer crates most pipelines use: pattern, NER, and LLM. Set
## `default-features = false` to drop them and opt into only what you need
## (e.g. `codec`, `serde`).
default = ["pattern", "ner", "llm"]

## Derive `serde::{Serialize, Deserialize}` on the re-exported core
## domain types. Recognizer crates (`pattern`/`ner`/`llm`) need serde
## structurally and pull it in regardless; `codec` forwards it when both
## are enabled.
serde = ["elide-core/serde", "elide-detection/serde", "elide-operator/serde", "elide-redaction/serde", "elide-codec?/serde", "elide-engine?/serde"]

## Derive `schemars::JsonSchema` on the re-exported domain types, for
## emitting JSON Schemas of the serialized model. Implies serde. Forwards to
## the engine crates; the optional ones (`codec`/`orchestration`/`ner`) only
## when they're enabled.
schema = [
    "serde",
    "elide-core/schema",
    "elide-detection/schema",
    "elide-operator/schema",
    "elide-redaction/schema",
    "elide-codec?/schema",
    "elide-engine?/schema",
    "elide-ner?/schema",
]

## Re-export the pattern recognizer crate.
pattern = ["dep:elide-pattern"]
## Re-export the NER recognizer crate.
ner = ["dep:elide-ner"]
## Re-export the lingua language-detection crate.
lingua = ["dep:elide-lingua"]

## Re-export the LLM recognizer crate. Lean by default (the trait, recognizer,
## prompts, and — with `mock` — the stub backend); add `llm-rig` or a provider
## feature for the rig-backed network backend.
llm = ["dep:elide-llm"]
## The rig-backed `RigBackend` and its HTTP stack in the re-exported LLM
## crate.
llm-rig = ["llm", "elide-llm/rig"]
## The `Jinja2Prompt` template-driven prompt builder, so a caller can load
## detect-pass prompts from `.j2` templates without depending on `elide-llm`
## directly.
llm-jinja2 = ["llm", "elide-llm/jinja2"]
## The OpenAI GPT provider for the rig LLM backend (implies `llm-rig`).
llm-openai = ["llm", "elide-llm/openai-gpt"]
## The Anthropic Claude provider for the rig LLM backend (implies `llm-rig`).
llm-anthropic = ["llm", "elide-llm/anthropic-claude"]
## The Google Gemini provider for the rig LLM backend (implies `llm-rig`).
llm-gemini = ["llm", "elide-llm/google-gemini"]

## Re-export the STT (speech-to-text) recognizer crate.
stt = ["dep:elide-stt", "audio"]
## Re-export the OCR recognizer crate.
ocr = ["dep:elide-ocr", "image"]

## The `audio` modality. Implied by the audio codec formats.
audio = ["elide-core/audio", "elide-operator/audio"]
## The `image` modality. Implied by the image codec formats.
image = ["elide-core/image", "elide-operator/image"]
## The `tabular` modality. Implied by the tabular codec formats.
tabular = ["elide-core/tabular", "elide-operator/tabular", "elide-redaction/tabular"]

## Re-export the codec crate and the orchestration engine (`Orchestrator`,
## `Report`). On its own this enables only the codec's default formats; use the
## per-modality or per-format `codec-*` features below to pull in the shipped
## format handlers.
codec = ["dep:elide-codec", "dep:elide-engine"]

## Per-modality format groups (each aggregates its per-format features).
codec-text = ["codec-txt", "codec-json", "codec-html", "codec-xml"]
codec-tabular = ["codec-csv", "codec-xlsx"]
codec-image = ["codec-png", "codec-jpeg", "codec-tiff"]
codec-audio = ["codec-wav", "codec-mp3"]
codec-document = ["codec-docx", "codec-pptx", "codec-pdf", "codec-rtf"]

## Per-format handlers.
codec-txt = ["codec", "elide-codec/txt"]
codec-json = ["codec", "elide-codec/json"]
codec-html = ["codec", "elide-codec/html"]
codec-xml = ["codec", "elide-codec/xml"]
codec-csv = ["codec", "tabular", "elide-codec/csv"]
codec-xlsx = ["codec", "tabular", "codec-xml", "elide-codec/xlsx"]
codec-png = ["codec", "image", "elide-codec/png"]
codec-jpeg = ["codec", "image", "elide-codec/jpeg"]
codec-tiff = ["codec", "image", "elide-codec/tiff"]
codec-wav = ["codec", "audio", "elide-codec/wav"]
codec-mp3 = ["codec", "audio", "elide-codec/mp3"]
codec-docx = ["codec", "elide-codec/docx"]
codec-pptx = ["codec", "elide-codec/pptx"]
codec-pdf = ["codec", "elide-codec/pdf"]
## PDF page rendering for OCR of scanned/image-only PDFs. Requires the native
## PDFium library present at runtime (see `scripts/install-pdfium.sh`); pulls
## `pdfium-render` + `rayon` + the image stack. Opt-in on its own — not part of
## `codec-document` — so the document group stays free of native deps.
codec-pdf-render = ["codec-pdf", "elide-codec/pdf-render"]
codec-rtf = ["codec", "elide-codec/rtf"]

## Ship the no-op mock backends in the re-exported recognizer crates.
mock = ["elide-ner?/mock", "elide-llm?/mock", "elide-stt?/mock", "elide-ocr?/mock"]

## The one-way `Sha2Hash` operator (SHA-256 / SHA-512).
sha2 = ["elide-operator/sha2"]
## The keyed `HmacHash` operator (HMAC-SHA-256 / HMAC-SHA-512).
hmac = ["elide-operator/hmac"]
## The reversible `AesEncrypt` operator (AES-256-GCM) and its `KeyProvider`.
aes = ["elide-operator/aes"]
## The `GeneralizeDate` operator (reduce date/timestamp granularity).
datetime = ["elide-operator/datetime"]
## The locale-aware `Fake` redaction operator based on the `fake` crate.
fake = ["elide-operator/fake"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }
elide-context = { workspace = true, features = [] }
elide-detection = { workspace = true, features = [] }
elide-pattern = { workspace = true, features = [], optional = true }
elide-ner = { workspace = true, features = [], optional = true }
elide-lingua = { workspace = true, features = [], optional = true }
elide-llm = { workspace = true, features = [], optional = true }
elide-stt = { workspace = true, features = [], optional = true }
elide-ocr = { workspace = true, features = [], optional = true }
elide-codec = { workspace = true, features = [], optional = true }
elide-engine = { workspace = true, features = [], optional = true }
elide-operator = { workspace = true, features = [] }
elide-redaction = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates (test utils)
elide-office = { workspace = true, features = ["test-util"] }

# (De)serialization
serde_json = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = ["v4"] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Format families: one test binary per format (or format family), each a
# folder of scenario files under a same-named driver. The OOXML formats
# (docx, xlsx, …) share the OPC package engine, so they share one `office`
# binary; PDF's born-digital and raster paths share `format_pdf`.
[[test]]
name = "format_ooxml"
required-features = ["codec-docx", "codec-xlsx", "codec-pptx", "codec-xml", "mock", "serde"]

[[test]]
name = "format_pdf"
required-features = ["codec-pdf-render", "mock", "serde"]

[[test]]
name = "format_txt"
required-features = ["codec-txt", "mock", "serde"]

[[test]]
name = "format_json"
required-features = ["codec-json", "mock", "serde"]

[[test]]
name = "format_html"
required-features = ["codec-html", "mock", "serde"]

[[test]]
name = "format_csv"
required-features = ["codec-csv", "mock", "serde"]

[[test]]
name = "format_image"
required-features = ["codec-png", "codec-jpeg", "codec-tiff", "ocr", "mock", "serde"]

[[test]]
name = "format_audio"
required-features = ["codec-wav", "codec-mp3", "stt", "mock", "serde"]

# Format-independent facade integration: detection pipeline, audit trail,
# cross-modal context enhancement, and the reviewable `select` seam.
[[test]]
name = "pipeline"
required-features = ["codec-docx", "codec-png", "llm", "ocr", "stt", "mock", "serde"]
