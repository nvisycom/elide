# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-image"
description = "Raster image decode/encode, EXIF metadata read and strip, and pixel-region redaction: bytes in, bytes out"
keywords = ["image", "exif", "metadata", "redaction", "privacy"]
categories = ["multimedia::images", "computer-vision"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[features]
## No default features: bytes-in/bytes-out, no format enabled until asked.
default = []

## The JPEG format: decode/encode and lossless metadata strip.
jpeg = ["image/jpeg"]

## The PNG format: decode/encode and lossless metadata strip.
png = ["image/png"]

## The TIFF format: decode/encode and lossless metadata strip.
tiff = ["image/tiff"]

## EXIF metadata: read the privacy-relevant fields, strip them, and surface each
## as an `Entity<Metadata>` so a stripped field flows through the same
## detect/audit pipeline as a redacted text span. Pulls in `little_exif`,
## elide-core's `metadata` modality, and the recognizer's async-trait; a
## bytes-only consumer (pixel decode without metadata) needn't enable it.
exif = ["dep:little_exif", "dep:async-trait", "elide-core/metadata"]

## Expose `test_util`: build small in-memory image fixtures (a JPEG carrying a
## GPS EXIF tag) and inspect them, so a downstream crate can exercise the EXIF
## path without depending on `image`/`little_exif` itself. Implies `exif`.
test-util = ["exif", "jpeg", "png"]

## Derive `serde::{Serialize, Deserialize}` on the metadata model, so a caller
## can ship a metadata read across a boundary. Implies the same on elide-core's
## image types the engine speaks in.
serde = ["dep:serde", "elide-core/serde"]

## Derive `schemars::JsonSchema` on the schema-relevant types (e.g. `ExifPolicy`),
## for a caller that emits a JSON schema for a config surface the enum appears in.
## Implies `serde`.
schema = ["serde", "dep:schemars", "elide-core/schema"]

## OCR: the `OcrBackend` trait, the `OcrEnricher`, and the request/response
## types. The traits ship bare (no OCR engine); enable `ocrs` for the pure-Rust
## engine or `test-utils` for the no-op backend.
ocr = ["dep:async-trait", "dep:derive_builder", "dep:uuid"]

## The `ocrs` engine backend: a pure-Rust OCR engine (ocrs + the RTen runtime,
## both MIT/Apache-2.0, no native library). Off by default; the detection and
## recognition models are loaded from disk at runtime (see `OcrsBackend`).
ocrs = [
    "ocr",
    "dep:ocrs",
    "dep:rten",
    "dep:rten-imageproc",
    "dep:rayon",
    "dep:futures",
]

## Ship the no-op OCR `MockBackend` for tests, examples, and offline wiring.
## Implies `ocr`.
test-utils = ["ocr"]

## Resource-usage accounting: surface the `ModelUsage` the OCR enricher attaches
## to its `Enrichment`. Off by default.
usage = ["elide-core/usage"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Derive macros (the OCR enricher builder)
derive_builder = { workspace = true, features = [], optional = true }
uuid = { workspace = true, features = ["v7"], optional = true }

# Async runtime & parallelism
async-trait = { workspace = true, features = [], optional = true }

# Image processing
image = { workspace = true, features = [] }
imageproc = { workspace = true, features = ["rayon"] }
little_exif = { workspace = true, features = [], optional = true }

# OCR engine (optional; the `ocrs` feature)
ocrs = { workspace = true, features = [], optional = true }
rten = { workspace = true, features = [], optional = true }
rten-imageproc = { workspace = true, features = [], optional = true }
rayon = { workspace = true, features = [], optional = true }
futures = { workspace = true, features = [], optional = true }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism (OCR enricher tests)
tokio = { workspace = true, features = ["macros", "rt"] }

# Testing
mockall = { workspace = true, features = [] }
