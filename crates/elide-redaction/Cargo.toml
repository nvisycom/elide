# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-redaction"
description = "Redaction engine for the Elide toolkit: the Anonymizer and Deanonymizer that select and apply operators"
keywords = ["pii", "redaction", "anonymization", "masking"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Forward `serde` support to `elide-core`, so the audit/entity types this
## crate operates on serialize. This crate defines no types of its own that
## derive serde, so it pulls no serde dependency directly.
serde = ["elide-core/serde"]

## Forward `schemars` support to `elide-core`. As with `serde`, this crate
## derives no schema of its own, so it only propagates the feature.
schema = ["serde", "elide-core/schema"]

## The `Deanonymizer` supports the `tabular` modality unconditionally (its impl
## is generic over text-backed modalities); this only pulls `elide-core`'s
## `tabular` feature so the doc references to `Tabular` resolve. No effect on
## behaviour.
tabular = ["elide-core/tabular"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
hipstr = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
elide-operator = { workspace = true, features = ["aes", "hmac", "datetime"] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["rt", "macros"] }
