# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-plain"
description = "Leaf text-shaped format handlers (TXT, JSON, HTML, XML, CSV) adapting the elide-codec contracts"
keywords = ["elide", "codec", "text", "markup", "csv"]
categories = ["encoding", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No format enabled by default.
default = []

## Individual text formats.
txt = ["internal_text"]
json = ["internal_text", "dep:serde_json"]
xml = ["internal_extract", "dep:quick-xml"]
html = ["xml"]
csv = ["internal_tabular", "dep:csv"]

## The text-shaped leaf formats.
text = ["txt", "json", "html", "xml"]

# Internal markers, mirroring `elide-codec`: set automatically by a format
# feature; not meant to be enabled directly. `internal_tabular` pulls
# `internal_text` because tabular cells reuse the text-redaction helper.
internal_text = ["elide-codec/internal_text"]
internal_extract = ["internal_text", "elide-codec/internal_extract"]
internal_tabular = ["internal_text", "elide-core/tabular"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }
elide-codec = { workspace = true, features = [] }

# (De)serialization
serde_json = { workspace = true, features = [], optional = true }
csv = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# Markup parsing
quick-xml = { workspace = true, features = [], optional = true }

[dev-dependencies]
# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
