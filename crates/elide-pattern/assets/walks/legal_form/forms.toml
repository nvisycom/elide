# Legal forms a company name ends in, by the country that defines them,
# from stella/anonymize's `legal-forms.json` (Latin-script forms only)
# plus its core suffix list, each also in capitals. A form is not tied to
# a language: "Siemens AG" appears in English text too. See
# ../../STELLA.md.
#
# `ambiguous` forms are also ordinary words or abbreviations (`AG`,
# `Trust`, `Co.`): a name ending in one scores below the default threshold
# and needs a context keyword nearby.

