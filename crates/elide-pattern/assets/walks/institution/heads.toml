# Head words that make a capitalized phrase an institution, from
# stella/anonymize's `institutional-organization-heads.json`, each also in
# capitals. See ../../STELLA.md.
#
# `ambiguous` heads also name everyday things (`Office`): a name around
# one needs a context keyword nearby.

distinctive = [
  "AGENCY", "ASSOCIATION", "AUTHORITY", "Agency", "Association", "Authority",
  "BOARD", "Board", "CHAMBERS", "COMMISSION", "COMMITTEE", "COUNCIL", "COURT",
  "Chambers", "Commission", "Committee", "Council", "Court", "DEPARTMENT",
  "DIRECTORATE", "Department", "Directorate", "FOUNDATION", "Foundation",
  "HOSPITAL", "Hospital", "INSTITUTE", "Institute", "MINISTRY", "Ministry",
  "REGISTRY", "Registry", "SOCIETY", "SOLICITORS", "Society", "Solicitors",
  "TRIBUNAL", "Tribunal", "UNIVERSITY", "University"
]
ambiguous = [
  "OFFICE", "Office"
]
