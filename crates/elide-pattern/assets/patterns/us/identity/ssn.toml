# US Social Security Number.
#
# The separated form scores on its own; the nine digits run together are
# too common to, so they score below the default threshold and are kept
# only when a context keyword lifts them ("SSN: 123456789"). Off-position
# splits are omitted.

name = "ssn"
labels = ["government_id"]
countries = ["US"]

[context]
keywords = ["social security", "ssn", "tax id", "taxpayer identification"]

[[variants]]
regex = '\b(\d{3})[- .](\d{2})[- .](\d{4})\b'
score = 0.5
validator = "us.ssn"

[[variants]]
regex = '\b\d{9}\b'
score = 0.05
validator = "us.ssn"
