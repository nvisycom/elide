# US Individual Taxpayer Identification Number (ITIN).
#
# Format: 9NN-MM-NNNN where the middle group restricts to the
# IRS-published ranges. No checksum.

name = "us-itin"
labels = ["tax_id"]
countries = ["US"]
languages = ["en"]

[context]
keywords = [
  "individual",
  "taxpayer",
  "itin",
  "tax",
  "payer",
  "taxid",
  "tin",
]

# Dashes / spaces around the IRS-published middle range. The shape is
# indistinguishable from an SSN and carries no checksum, so — unlike the SSN
# pattern, which earns a self-firing 0.5 through its `us.ssn` validator — this
# unvalidated form must not fire on shape alone. It scores below the detection
# baseline; a context keyword (`itin`, `taxpayer`, `tin`, …) lifts a genuine
# match over the threshold.
[[variants]]
regex = '\b9\d{2}[- ](?:5\d|6[0-5]|7\d|8[0-8]|9(?:[0-2]|[4-9]))[- ]\d{4}\b'
score = 0.3

# Unbroken 9-digit form: weaker still, likewise keyword-gated.
[[variants]]
regex = '\b9\d{2}(?:5\d|6[0-5]|7\d|8[0-8]|9(?:[0-2]|[4-9]))\d{4}\b'
score = 0.3
