# German Postleitzahl (PLZ): 5 digits, with `01000` and `99999`
# reserved as test sentinels and never assigned.

name = "de-plz"
labels = ["postal_code"]
countries = ["DE"]
languages = ["de"]

[context]
keywords = [
  "postleitzahl",
  "plz",
  "postanschrift",
  "anschrift",
  "lieferadresse",
  "rechnungsadresse",
  "postfach",
]

[[variants]]
regex = '\b(0[1-9]\d{3}|[1-9]\d{4})\b'
score = 0.2
validator = "de.plz"
