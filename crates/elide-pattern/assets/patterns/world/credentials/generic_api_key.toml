# Generic API key / secret: a key-like keyword (api key, secret,
# access token, bearer, …) next to a 20+ char token value. Split
# into variants by how strong the surrounding form is, so each
# scores on its own merit rather than sharing one blended score.
#
# The two-word keywords accept the word break as a space, `_`, or
# `-` (`api key`, `api_key`, `api-key`), so prose is caught
# alongside the structured forms.

name = "generic-api-key"
labels = ["api_key"]

# Assignment form: `api_key = "<token>"`, `secret-key: <token>`.
# The `:`/`=` separator is a strong signal this is a real
# credential, not incidental prose.
[[variants]]
regex = "(?i)(?:api[_\\-\\s]?key|api[_\\-\\s]?secret|access[_\\-\\s]?token|secret[_\\-\\s]?key)\\s*[:=]\\s*[\"']?([a-zA-Z0-9_\\-\\.]{20,})[\"']?"
score = 0.5

# Authorization-header form: `Authorization: Bearer <token>`. The
# dominant real-world leak shape, so it scores as high as the
# assignment form.
[[variants]]
regex = "(?i)bearer\\s+[\"']?([a-zA-Z0-9_\\-\\.]{20,})[\"']?"
score = 0.5

# Prose form: `the API key <token>` with only whitespace between
# keyword and value. Looser (any 20+ char token following the
# words) so it scores lower — still above the baseline, and a
# nearby context keyword can lift it further.
[[variants]]
regex = "(?i)(?:api[_\\-\\s]?key|api[_\\-\\s]?secret|access[_\\-\\s]?token|secret[_\\-\\s]?key)\\s+[\"']?([a-zA-Z0-9_\\-\\.]{20,})[\"']?"
score = 0.4
