# Monetary amount: a number that reads as a money value — grouped thousands
# and/or a decimal fraction (`5,000`, `1000.50`, `1,234,567.89`), or a bare
# integer beside a currency (`5000 USD`).
#
# Weak on its own: a bare number is rarely a monetary amount without evidence.
# It is lifted over the threshold by an `anchor` on the `currency` entity — a
# number is money when an *accepted* currency sits beside it (`5000 USD`,
# `500 BTC`, `0.5 ADA` in crypto context). Anchoring on the currency entity
# rather than on currency keywords means an ambiguous currency token that never
# cleared its own context gate (a bare `ADA` in `ADA 2010 standards`) does not
# lift the number. The amount is the number only; the currency is its own
# `currency` entity, so a policy can redact the value while keeping (or also
# redacting) the currency independently.

name = "monetary-amount"
labels = ["monetary_amount"]

[context]
anchor = { label = "currency" }

[[variants]]
# Grouped thousands with an optional decimal (`1,234`, `1,234.56`).
regex = '\b\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\b'
score = 0.3

[[variants]]
# A dot-decimal number (`1000.50`, `0.99`) — the fraction hints at money.
regex = '\b\d+\.\d{2}\b'
score = 0.2

[[variants]]
# A comma-decimal number (`1000,50`, `0,99`) — the comma-as-decimal
# rendering used across much of Europe and Latin America. The two-digit
# fraction distinguishes it from grouped thousands (`1,234`, three digits).
regex = '\b\d+,\d{2}\b'
score = 0.2

[[variants]]
# A bare integer (`5000`). Ambiguous on its own, so its base score sits well
# below threshold: it only becomes a monetary amount when a currency term
# nearby boosts it (a lone `5000` in prose is never flagged).
regex = '\b\d+\b'
score = 0.1
