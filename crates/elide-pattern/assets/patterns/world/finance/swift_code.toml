# SWIFT / BIC code (ISO 9362): 4-letter bank code, 2-letter ISO country
# code, 2-char location code, and an optional 3-char branch code.
#
# The regex matches any 8- or 11-char uppercase alphanumeric run, so it
# collides with ordinary uppercase words. The `swift` validator rejects a
# match whose characters 5-6 are not a real ISO 3166-1 country, which removes
# the bulk (`DECEMBER` → `MB`, `PLEASURE` → `SU`). But a plain word whose 5th-6th
# letters happen to spell a country code (`CHOLESTEROL` → `ES`, `JEZEWSKIEGO` →
# `WS`) still passes, and no checksum distinguishes it from a real BIC. So the
# base score sits *below* the acceptance threshold: a BIC-shaped token surfaces
# only when a `swift`/`bic` context keyword nearby boosts it over the line. A
# real BIC is virtually always written next to one of those; a medical or other
# uppercase word is not.

name = "swift-code"
labels = ["swift_code"]

[context]
keywords = ["swift", "bic", "swift code", "bic code"]

[[variants]]
# Below the 0.35 default threshold: needs a context-keyword boost to surface.
regex = "\\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\\b"
score = 0.3
validator = "swift"
