# SWIFT / BIC code (ISO 9362): 4-letter bank code, 2-letter ISO country
# code, 2-char location code, and an optional 3-char branch code.
#
# The regex alone matches any 8- or 11-char uppercase alphanumeric run, so
# it collides with ordinary uppercase words (`DECEMBER`, `PLEASURE`). The
# `swift` validator rejects any match whose characters 5-6 are not a real
# ISO 3166-1 country, and the context keywords keep a residual word whose
# country segment happens to be valid from clearing the threshold without
# nearby banking context.

name = "swift-code"
labels = ["swift_code"]

[context]
keywords = ["swift", "bic", "swift code", "bic code", "bank"]

[[variants]]
regex = "\\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\\b"
score = 0.5
validator = "swift"
