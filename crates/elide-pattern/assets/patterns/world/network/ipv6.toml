# IPv6 address.
#
# IPv6 has many compression forms (`::`, embedded IPv4, mixed splits) that a
# single strict regex either truncates or over-matches — Rust's `regex` crate
# has no look-around to disambiguate them. Instead a permissive regex captures
# a maximal address-shaped token and the `ipv6` validator confirms it with the
# standard library's parser (the reference implementation), the same
# permissive-match-then-validate approach the checksum patterns use.

name = "ipv6"
labels = ["ip_address"]

[[variants]]
# Addresses with leading hex groups: `(hex:){2,7}` then an optional trailing
# hextet or embedded IPv4 quad, with optional `%zone` and `/prefix`.
regex = '\b(?:[0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f.]{0,4}(?:%[0-9A-Za-z]+)?(?:/\d{1,3})?'
score = 0.6
validator = "ipv6"

[[variants]]
# Addresses that start with `::` (`::1`, `::ffff:192.0.2.1`, `::`).
regex = '::(?:[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4})*(?:\.\d{1,3}){0,3})?(?:%[0-9A-Za-z]+)?(?:/\d{1,3})?'
score = 0.6
validator = "ipv6"
