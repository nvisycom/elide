# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-ner"
description = "Named-entity recognition for the Elide toolkit: the NER recognizer, its backend contract, and label and score decorators"
keywords = ["ner", "nlp", "pii"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[features]
## No features on by default. Enable `mocks` for the no-op backend.
default = []

## Ship the no-op `MockBackend` for tests, examples, and offline wiring.
mocks = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
hipstr = { workspace = true, features = [] }

# Async runtime & parallelism
async-trait = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }
