# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-pdf"
description = "Standalone PDF text extraction and born-digital redaction: bytes in, bytes out"
keywords = ["pdf", "redaction", "extraction", "lopdf", "elide"]
categories = ["parsing", "text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No default features: born-digital text extraction and redaction via a
## pure-Rust parser, no native dependency.
default = []

## Derive `serde::{Serialize, Deserialize}` on the extraction/coverage model.
serde = ["dep:serde"]

## Redact embedded images by replacing an image XObject's stream with new
## (redacted) bytes, rebuilding a valid XObject from an encoded PNG/JPEG.
## Pure-Rust; pulls the `image` crate (via lopdf's `embed_image`) to build the
## XObject. Off by default so a text-only build stays lean.
image = ["dep:image", "lopdf/embed_image"]

## Render pages to images (for OCR of scanned/image-only PDFs) via the native
## PDFium shared library. Off by default: the default build is pure-Rust with
## no native dependency. Requires the PDFium `.so`/`.dylib` at runtime (see
## `scripts/install-pdfium.sh`); pulls `pdfium-render`, `rayon`, and `image`.
render = ["dep:pdfium-render", "dep:rayon", "dep:image", "dep:sha2"]

## Verification helpers for tests: confirm a raster redaction actually painted
## the pixels it claimed. Pulls `render`.
test-utils = ["render"]

[dependencies]
# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }

# Derive macros & error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Encoding & hashing
sha2 = { workspace = true, features = [], optional = true }

# Async runtime & parallelism
rayon = { workspace = true, features = [], optional = true }

# Markup parsing
lopdf = { workspace = true, default-features = false }

# Image processing
image = { workspace = true, features = [], optional = true }

# Rendering
pdfium-render = { workspace = true, features = [], optional = true }

[dev-dependencies]
# Markup parsing
lopdf = { workspace = true, default-features = false }

# Image processing
image = { workspace = true, features = ["png"] }
