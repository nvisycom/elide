# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-pdf"
description = "Standalone PDF text extraction and born-digital redaction: bytes in, bytes out"
keywords = ["pdf", "redaction", "extraction", "lopdf", "elide"]
categories = ["parsing", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No default features: born-digital text extraction and redaction via a
## pure-Rust parser, no native dependency.
default = []

## Derive `serde::{Serialize, Deserialize}` on the extraction model, and on the
## codec config types (`RasterMode`, `Dpi`).
serde = ["dep:serde"]

## Derive `schemars::JsonSchema` on the codec config types (`RasterMode`,
## `Dpi`). Implies `serde`.
schema = ["serde", "dep:schemars"]

## Expose `fixtures`: build small in-memory PDF fixtures (embedded images,
## an attachment, metadata) and inspect an encoded PDF, so a downstream crate
## can exercise the PDF codec without depending on `lopdf`/`image` itself.
fixtures = []

## Render pages to images (for OCR of scanned/image-only PDFs) via the native
## PDFium shared library, and redact them by reflattening. Off by default: the default build is pure-Rust with no native
## dependency. Requires the PDFium `.so`/`.dylib` at runtime (see
## `scripts/install-pdfium.sh`); pulls `pdfium-render`, `rayon`, and `sha2`.
render = ["dep:pdfium-render", "dep:rayon", "dep:sha2"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }
elide-codec = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, features = [], optional = true }

# Primitive datatypes
hipstr = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Encoding & hashing
sha2 = { workspace = true, features = [], optional = true }

# Async runtime & parallelism
rayon = { workspace = true, features = [], optional = true }
async-trait = { workspace = true, features = [] }

# Markup parsing
lopdf = { workspace = true, default-features = false, features = ["embed_image"] }

# Image processing
image = { workspace = true, features = [] }

# Rendering
pdfium-render = { workspace = true, features = [], optional = true }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }

# Markup parsing
lopdf = { workspace = true, default-features = false }

# Image processing
image = { workspace = true, features = ["png"] }
