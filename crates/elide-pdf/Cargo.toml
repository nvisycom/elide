# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-pdf"
description = "PDF codec for elide: glyph-level and raster redaction of text, images, and attachments"
keywords = ["pdf", "redaction", "pii", "lopdf", "elide"]
categories = ["parsing", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
## No default features: glyph-deletion redaction via a pure-Rust parser, no
## native dependency.
default = []

## Derive `serde::{Serialize, Deserialize}` on the codec config types
## (`RasterMode`, `Dpi`).
serde = ["dep:serde"]

## Derive `schemars::JsonSchema` on the codec config types (`RasterMode`,
## `Dpi`). Implies `serde`.
schema = ["serde", "dep:schemars"]

## Expose `fixtures`: build small in-memory PDF fixtures (embedded images,
## an attachment, metadata) and inspect an encoded PDF, so a downstream crate
## can exercise the PDF codec without depending on `lopdf`/`image` itself.
fixtures = []

## Render pages to images via the native PDFium shared library: scanned pages
## for OCR, and every page under `RasterMode::Always`, each replaced by its
## redacted image. Requires the PDFium `.so`/`.dylib` at runtime (see
## `scripts/install/pdfium.sh`); pulls `pdfium-render`, `rayon`, and
## `elide-image`, whose image modality a scanned page is surfaced as.
render = ["dep:pdfium-render", "dep:rayon", "dep:elide-image", "elide-image/png"]

[dependencies]
# Internal crates
elide-core = { workspace = true, features = [] }
elide-codec = { workspace = true, features = [] }
elide-image = { workspace = true, features = [], optional = true }

# (De)serialization
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }

# Text processing
unicode-normalization = { workspace = true, features = [] }

# Async runtime & parallelism
rayon = { workspace = true, features = [], optional = true }
async-trait = { workspace = true, features = [] }

# Markup parsing
lopdf = { workspace = true, default-features = false, features = ["embed_image"] }
hayro-cmap = { workspace = true, features = ["embed-cmaps"] }
read-fonts = { workspace = true, features = ["std", "type1"] }

# Image processing
image = { workspace = true, features = [] }

# Rendering
pdfium-render = { workspace = true, features = [], optional = true }

[dev-dependencies]
# (De)serialization
serde_json = { workspace = true, features = [] }

# Async runtime & parallelism
tokio = { workspace = true, features = ["macros", "rt"] }

# Markup parsing
lopdf = { workspace = true, default-features = false }

# Image processing
image = { workspace = true, features = ["png"] }
